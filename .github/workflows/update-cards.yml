name: 프로필 카드 갱신

on:
  schedule:
    - cron: "23 15 * * *"   # 매일 한국 시간 00:23
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/update-cards.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: 통계 + 랭크 카드
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&bg_color=0d1117&title_color=22d3a6&icon_color=a855f7&text_color=c9d1d9&ring_color=22d3a6&hide_border=true&border_radius=12
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 사용 언어 카드
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=0d1117&title_color=22d3a6&text_color=c9d1d9&hide_border=true&border_radius=12
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 카드 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "프로필 카드 갱신" || exit 0
          git push
